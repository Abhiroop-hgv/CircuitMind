<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
    <marker id="aAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>
    <style>
      .t    { fill:#0F172A; font-size:15px; font-weight:600; }
      .s    { fill:#475569; font-size:12.5px; }
      .xs   { fill:#64748B; font-size:11px; }
      .band { fill:#94A3B8; font-size:11px; font-weight:700; letter-spacing:1.6px; }
      .num  { fill:#FFFFFF; font-size:12px; font-weight:700; }
      .mono { font-family:Consolas, ui-monospace, monospace; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- title -->
  <text x="60" y="62" fill="#0F172A" font-size="27" font-weight="700">CircuitMind — system architecture</text>
  <text x="60" y="88" class="s">An AI layer on top of the ERP you already run. The model picks the question; the database gives the answer.</text>

  <!-- ═══════════ INPUTS ═══════════ -->
  <text x="60" y="140" class="band">SOURCES</text>
  <g>
    <rect x="60" y="154" width="290" height="72" rx="9" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.6"/>
    <text x="80" y="182" class="t">Published notices</text>
    <text x="80" y="203" class="s">export controls, port closures, fab incidents</text>
    <text x="80" y="219" class="xs">these already happened — we never guess ahead</text>
  </g>
  <g>
    <rect x="376" y="154" width="290" height="72" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/>
    <text x="396" y="182" class="t">BOM documents</text>
    <text x="396" y="203" class="s">PDF · XLSX · CSV · TXT</text>
    <text x="396" y="219" class="xs">a new board about to go into production</text>
  </g>

  <path d="M205 226 V264" stroke="#EF4444" stroke-width="2" marker-end="url(#a)"/>
  <path d="M521 226 V264" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/>

  <!-- ═══════════ AGENTS ═══════════ -->
  <text x="60" y="292" class="band">AGENTS</text>
  <rect x="46" y="304" width="1216" height="268" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>

  <!-- 1 intelligence -->
  <g>
    <rect x="70" y="330" width="272" height="94" rx="9" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
    <circle cx="94" cy="354" r="11" fill="#2563EB"/><text x="94" y="358" text-anchor="middle" class="num">1</text>
    <text x="114" y="358" class="t">Intelligence</text>
    <text x="90" y="382" class="s">extract → match → score</text>
    <text x="90" y="401" class="xs">it can only pick from categories that already</text>
    <text x="90" y="415" class="xs">exist in the database &#8212; it cannot invent one</text>
  </g>

  <!-- BOM intake -->
  <g>
    <rect x="376" y="330" width="272" height="94" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8"/>
    <text x="396" y="358" class="t">BOM intake</text>
    <text x="396" y="382" class="s">parse → resolve → register</text>
    <text x="396" y="401" class="xs">parts we do not recognise are listed for a</text>
    <text x="396" y="415" class="xs">person to pick — never matched on its own</text>
  </g>

  <!-- 2 demand -->
  <g>
    <rect x="70" y="450" width="272" height="94" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8"/>
    <circle cx="94" cy="474" r="11" fill="#64748B"/><text x="94" y="478" text-anchor="middle" class="num">2</text>
    <text x="114" y="478" class="t">Demand</text>
    <text x="90" y="502" class="s">Holt-Winters, called as a tool</text>
    <text x="90" y="521" class="xs">each month we take the bigger of ordered or</text>
    <text x="90" y="535" class="xs">forecast, not both — adding them counts twice</text>
  </g>

  <!-- 3 supply risk -->
  <g>
    <rect x="376" y="450" width="272" height="94" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8"/>
    <circle cx="400" cy="474" r="11" fill="#64748B"/><text x="400" y="478" text-anchor="middle" class="num">3</text>
    <text x="420" y="478" class="t">Supply risk</text>
    <text x="396" y="502" class="s">running stock ledger</text>
    <text x="396" y="521" class="xs">stock that lands after you needed it does not</text>
    <text x="396" y="535" class="xs">count towards the shortage</text>
  </g>

  <!-- 4 component -->
  <g>
    <rect x="682" y="330" width="272" height="94" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8"/>
    <circle cx="706" cy="354" r="11" fill="#64748B"/><text x="706" y="358" text-anchor="middle" class="num">4</text>
    <text x="726" y="358" class="t">Component</text>
    <text x="702" y="382" class="s">retrieve → verify, rule by rule</text>
    <text x="702" y="401" class="xs">checked against the board's own limits:</text>
    <text x="702" y="415" class="xs">voltage, footprint, temperature, interfaces</text>
  </g>

  <!-- 5 procurement -->
  <g>
    <rect x="682" y="450" width="272" height="94" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8"/>
    <circle cx="706" cy="474" r="11" fill="#64748B"/><text x="706" y="478" text-anchor="middle" class="num">5</text>
    <text x="726" y="478" class="t">Procurement</text>
    <text x="702" y="502" class="s">exclude → adjust → plan</text>
    <text x="702" y="521" class="xs">suppliers caught by the event are dropped; the</text>
    <text x="702" y="535" class="xs">rest ranked on price and their on-time record</text>
  </g>

  <!-- assistant -->
  <g>
    <rect x="988" y="330" width="252" height="214" rx="9" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
    <text x="1008" y="358" class="t">Assistant</text>
    <text x="1008" y="380" class="s">ten read-only tools</text>
    <text x="1008" y="404" class="xs">"how much is left?"</text>
    <text x="1008" y="421" class="xs">"what am I short of?"</text>
    <text x="1008" y="438" class="xs">"which supplier delivers late?"</text>
    <line x1="1008" y1="456" x2="1220" y2="456" stroke="#E2E8F0"/>
    <text x="1008" y="478" class="xs">signs in with a read-only account;</text>
    <text x="1008" y="495" class="xs">the database itself refuses every write</text>
    <text x="1008" y="519" class="xs">if there is no query behind an</text>
    <text x="1008" y="536" class="xs">answer, we do not show it</text>
  </g>

  <!-- flow arrows -->
  <path d="M206 424 V450" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/>
  <path d="M342 377 H376" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/>
  <path d="M342 497 H376" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/>
  <path d="M512 424 V450" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/>
  <path d="M648 497 H668 V400 H682" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M818 424 V450" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/>


  <!-- ═══════════ HUMAN GATE ═══════════ -->
  <path d="M818 572 V604" stroke="#F59E0B" stroke-width="2.4" marker-end="url(#a)"/>
  <g>
    <rect x="560" y="604" width="516" height="70" rx="9" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.4"/>
    <text x="588" y="634" class="t">A person approves</text>
    <text x="588" y="656" class="s">nothing is ordered by the system, ever — the plan is shown with the options it rejected</text>
  </g>
  <path d="M1076 639 H1140" stroke="#16A34A" stroke-width="2.4" marker-end="url(#a)"/>
  <g>
    <rect x="1140" y="604" width="240" height="70" rx="9" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.8"/>
    <text x="1162" y="634" class="t">Purchase orders</text>
    <text x="1162" y="656" class="s">one PDF per supplier, not transmitted</text>
  </g>

  <!-- ═══════════ DATA ═══════════ -->
  <text x="60" y="726" class="band">DATA — POSTGRESQL</text>
  <g>
    <rect x="60" y="740" width="600" height="112" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/>
    <text x="84" y="770" class="t mono">erp</text>
    <text x="128" y="770" class="s">— read-only mirror of the system of record</text>
    <text x="84" y="796" class="s">products · bill of materials · components · suppliers · inventory · orders</text>
    <text x="84" y="822" class="xs">We never write here. The ERP stays in charge &#8212; in a real setup this is</text>
    <text x="84" y="838" class="xs">what an SAP or Oracle system would hand us.</text>
  </g>
  <g>
    <rect x="688" y="740" width="574" height="112" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="712" y="770" class="t mono">platform</text>
    <text x="790" y="770" class="s">— everything the analysis produces</text>
    <text x="712" y="796" class="s">events · impacts · forecasts · shortages · alternatives · recommendations</text>
    <text x="712" y="822" class="xs">Keeping the two apart means what we add can never be mistaken for</text>
    <text x="712" y="838" class="xs">what the ERP already owns.</text>
  </g>

  <!-- ═══════════ INTERFACE ═══════════ -->
  <text x="1294" y="726" class="band">INTERFACE</text>
  <g>
    <rect x="1290" y="740" width="250" height="112" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
    <text x="1312" y="770" class="t">FastAPI</text>
    <text x="1312" y="791" class="xs">6 routers · live updates while it runs</text>
    <text x="1312" y="815" class="t">Next.js dashboard</text>
    <text x="1312" y="836" class="xs">the answer first, the workings underneath</text>
  </g>
</svg>
